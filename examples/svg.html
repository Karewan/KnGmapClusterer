<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>SVG markers - KnGmapClusterer</title>
		<link rel="stylesheet" href="./style.css">
		<style>
		#gallery {
			display: grid;
			grid-template-columns: repeat(6, 40px);
			gap: 6px;
			margin-top: 8px;
		}
		#gallery img {
			width: 40px;
			height: 40px;
			object-fit: contain;
		}
		</style>
	</head>
	<body>
		<div id="map"></div>
		<div class="panel">
			<h1>SVG markers</h1>
			<div>
				SVG pins and badges generated by <code>knSvg</code> (external SVG file, raw SVG or
				generator). Each distinct icon is rasterized only once.
				<a href="../index.html">← examples</a>
			</div>
			<div id="gallery"></div>
			<div id="info"></div>
		</div>
		<script type="module" src="./svg.ts"></script>
	</body>
</html>
